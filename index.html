<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页应用</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>欢迎来到我的网页应用！</h1>
        
        <div class="intro">
            <p>这是一个使用纯HTML、CSS和JavaScript创建的基本网页应用。您可以通过以下方式进一步开发：</p>
            <ul>
                <li>修改HTML结构添加更多内容</li>
                <li>调整CSS样式美化界面</li>
                <li>添加JavaScript实现交互功能</li>
                <li>或者使用现代前端框架进行开发</li>
            </ul>
        </div>
        
        <button class="btn">点击我</button>
        <button class="btn" onclick="addNewFeature()">添加新功能</button>
        <button class="btn" onclick="fetchData()">获取数据</button>
        
        <div class="features">
            <h2>功能示例</h2>
            <div class="feature-item">
                <h3>响应式设计</h3>
                <p>适配不同屏幕尺寸的设备</p>
            </div>
            <div class="feature-item">
                <h3>交互元素</h3>
                <p>按钮点击、表单提交等交互功能</p>
            </div>
            <div class="feature-item">
                <h3>动态内容</h3>
                <p>使用JavaScript动态更新页面内容</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
