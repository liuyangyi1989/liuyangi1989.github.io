<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>霍兰德职业兴趣测评（10题）</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>霍兰德职业兴趣测评（RIASEC）</h1>
      <p>共 10 题，选择每个描述与你的匹配程度（1=非常不符合，5=非常符合）。</p>
      <p class="sub">本测评为兴趣探索工具，不作为唯一职业决策依据。</p>
    </header>

    <section class="card" id="quiz-section" aria-labelledby="quiz-title">
      <h2 id="quiz-title">开始答题</h2>
      <form id="quiz-form">
        <p id="progress-text" class="progress-text">当前进度：0 / 10 题</p>
        <div class="actions">
          <button id="submit-btn" type="submit" class="btn primary" disabled>提交并查看测评结果</button>
          <button id="reset-btn" type="button" class="btn ghost">重置作答</button>
        </div>
      </form>
    </section>

    <section class="card hidden" id="result-section" aria-live="polite">
      <h2>测评结果</h2>
      <div class="top-summary">
        <p><strong>你的前三兴趣类型：</strong><span id="top-codes">-</span></p>
      </div>

      <div class="chart-wrap">
        <canvas id="radar-chart" width="600" height="400" aria-label="霍兰德职业兴趣雷达图"></canvas>
      </div>

      <div id="dimension-explanations" class="dimension-grid"></div>

      <div class="actions">
        <button id="export-pdf-btn" type="button" class="btn primary">导出 PDF 报告</button>
      </div>
    </section>
  </main>
</body>
</html>
